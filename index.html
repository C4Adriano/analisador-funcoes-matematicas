<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Analisador de Funções Matemáticas">
    <title>Matemática</title>
    <style>
        body {
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            font-family: 'Times New Roman', Times, serif;
            font-size: clamp(3rem, 15vw, 10rem);
            font-variant: small-caps;
            animation: rgbColors 35s linear infinite;
        }

        /* Animação de cores RGB */
        @keyframes rgbColors {
            0% {color: rgb(255, 0, 0);} /* vermelho */
            16% {color: rgb(255, 255, 0);} /* amarelo */
            33% {color: rgb(0, 255, 0);} /* verde */
            50% {color: rgb(0, 255, 255);} /* ciano */
            66% {color: rgb(0, 0, 255);} /* azul */
            83% {color: rgb(255, 0, 255);} /* magenta */
            100% {color: rgb(255, 0, 0);} /* volta ao vermelho */
        }
    </style>
</head>
<body>
    <h1>Matemática</h1>
    <script src="main.js"></script>
</body>
</html>
