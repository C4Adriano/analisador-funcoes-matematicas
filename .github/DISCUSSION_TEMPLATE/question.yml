labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        ## Question / Dúvida
        
  - type: textarea
    id: question
    attributes:
      label: "Question / Dúvida"
      description: "English: Describe your question | Português: Descreva sua dúvida"
      placeholder: "..."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "Context / Contexto"
      description: "English: Any additional context | Português: Contexto adicional"
      placeholder: "..."
    validations:
      required: false